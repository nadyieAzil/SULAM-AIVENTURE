services:
  - type: web
    name: ai-mathmentor
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EMBED_MODEL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AUTH_REQUIRED
        sync: false
        value: "true"
      - key: RATE_LIMIT_PER_MIN
        sync: false
        value: "8"
      - key: RATE_LIMIT_PER_DAY
        sync: false
        value: "120"
      - key: ALLOWED_ORIGINS
        sync: false
